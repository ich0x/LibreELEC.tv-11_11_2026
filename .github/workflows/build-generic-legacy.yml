name: Build Legacy ISO

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_run:
    workflows: [Sync Upstream]
    types: [completed]
  workflow_dispatch:

jobs:
  build:
    name: Build LibreELEC with xlibre + legacy NVIDIA
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ bison flex python3 python3-pip python3-dev \
            meson ninja-build pkg-config autoconf automake libtool \
            xz-utils gzip bzip2 tar rsync \
            libpixman-1-dev libdrm-dev libx11-dev libfontconfig1-dev \
            libfreetype6-dev libxml2-dev libxkbcommon-dev libsystemd-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libxext-dev libxfixes-dev libxau-dev libxcb1-dev \
            libxshmfence-dev libv4l-dev libva-dev libpulse-dev \
            libasound2-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libvdpau-dev libxv-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libvulkan-dev libwayland-dev libxkbcommon-dev

      - name: Build LibreELEC with xlibre + legacy NVIDIA
        run: |
          cd ./build
          ./buildlibreelec.sh -p Generic -a x86_64 -j $(nproc)

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: LibreELEC-x86_64-legacy
          path: output/*.iso
          retention-days: 30