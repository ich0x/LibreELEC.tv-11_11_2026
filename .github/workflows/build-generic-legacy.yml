name: Build LibreELEC Generic-Legacy (XLibre/Xorg)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Maximize Runner Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Extra Disk Cleanup & Initial Space Check
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          df -h /

      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify & Provision XLibre Packages + Virtual X11 Hook
        run: |
          echo "=== Current Branch & Commit ==="
          git status
          git log -n 2 --oneline

          echo "=== Checking Custom XLibre Packages ==="
          for pkg in xlibre-server xlibre-input-libinput xlibre-video-amdgpu xlibre-video-intel xlibre-video-nouveau x11-gpu-selector; do
            if [ ! -f "packages/x11/${pkg}/package.mk" ]; then
              echo "ERROR: Missing packages/x11/${pkg}/package.mk!"
              exit 1
            fi
          done

          echo "=== Injecting x11-gpu-selector into packages/virtual/x11/package.mk ==="
          if ! grep -q "x11-gpu-selector" packages/virtual/x11/package.mk; then
            sed -i 's/PKG_DEPENDS_TARGET="/PKG_DEPENDS_TARGET="x11-gpu-selector /' packages/virtual/x11/package.mk
          fi
          grep "PKG_DEPENDS_TARGET" packages/virtual/x11/package.mk

      - name: Install LibreELEC Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint bash bc binutils build-essential \
            bzip2 ca-certificates ccache cpio flex gawk gcc g++ git gperf \
            gzip intltool jq libc6-dev libncurses5-dev libparse-yapp-perl \
            libssl-dev libtool libxml-parser-perl lzop m4 make patch \
            patchutils perl pkg-config python3 python3-distutils-extra \
            rdfind sed tar unzip uuid-dev wget xfonts-utils xsltproc \
            xz-utils zlib1g-dev zstd
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Restore ccache (Accelerated Repeat Builds)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: le-ccache-generic-legacy-${{ github.run_id }}
          restore-keys: |
            le-ccache-generic-legacy-

      - name: Configure ccache Limits
        run: |
          mkdir -p ~/.ccache
          ccache --set-config=max_size=6.0G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -z

      - name: Pre-Build XLibre & Build Generic-Legacy Image (With 60s Monitor)
        env:
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_COMPRESS: "1"
          CCACHE_MAXSIZE: "6G"
        run: |
          START_TS=$(date +%s)
          MAX_SEC=$((355 * 60))

          # Background monitor: prints disk % and time left every 60 seconds
          (
            while true; do
              NOW_TS=$(date +%s)
              ELAPSED=$((NOW_TS - START_TS))
              REMAINING_MIN=$(( (MAX_SEC - ELAPSED) / 60 ))
              DISK_INFO=$(df -h / | awk 'NR==2 {print $5 " used (" $3 "/" $2 ", " $4 " free)"}')
              echo ">>> [MONITOR] Disk: ${DISK_INFO} | Est. Time Left: ~${REMAINING_MIN}m <<<"
              sleep 60
            done
          ) &
          MONITOR_PID=$!
          trap "kill $MONITOR_PID 2>/dev/null || true" EXIT

          echo "=== Step 1: Pre-building XLibre & GPU Selector ==="
          PROJECT=Generic DEVICE=Generic-legacy ARCH=x86_64 ./scripts/build x11-gpu-selector

          echo "=== Step 2: Building Full Generic-Legacy Image ==="
          PROJECT=Generic DEVICE=Generic-legacy ARCH=x86_64 make image -j$(nproc)

          echo "=== Step 3: Reclaiming Disk Before Artifact Upload ==="
          rm -rf build.*/build build.*/toolchain sources/*/*.tar.* sources/*/*.zip || true
          ccache -s
          df -h /

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LibreELEC-Generic-legacy-x86_64-${{ github.run_number }}
          path: |
            target/*.img.gz
            target/*.tar
            target/*.sha256
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LibreELEC Generic-Legacy (XLibre/Xorg) #${{ github.run_number }}
          body: |
            Automated `Generic-legacy` (`x86_64`) build with runtime GPU-selectable **XLibre** (Intel/AMD) and **X.Org** (NVIDIA/fallback).
            - Force XLibre: add `x11=xlibre` to kernel cmdline or `X11_SERVER="xlibre"` in `/storage/.config/x11-server.conf`
            - Force Xorg: add `x11=xorg` to kernel cmdline or `X11_SERVER="xorg"` in `/storage/.config/x11-server.conf`
          files: |
            target/*.img.gz
            target/*.tar
            target/*.sha256
